<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />

    <title>Drum Visualizer - Demo</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="file-controls">
      <label>
        MIDI
        <input type="file" id="midi-file" accept=".mid,.midi" />
      </label>

      <label>
        Audio
        <input type="file" id="audio-file" accept="audio/*" />
      </label>
    </div>

    <div class="library-controls">
      <label for="song-select"> Biblioteca de canciones </label>

      <select id="song-select">
        <option value="">Seleccionar canción...</option>
      </select>

      <button type="button" id="load-song">Cargar canción</button>
    </div>

    <main id="app">
      <section id="visualizer">
        <!-- Three.js se renderiza aquí -->
      </section>

      <section id="controls">
        <div class="buttons">
          <button id="play">▶</button>
          <button id="pause">⏸</button>
          <button id="stop">■</button>

          <button id="backward">↶ 5s</button>
          <button id="forward">5s ↷</button>

          <div id="speed-controls">
            <label for="speed-control"> Velocidad </label>

            <button
              type="button"
              id="decrease-speed"
              title="Disminuir velocidad"
            >
              -
            </button>

            <input
              type="range"
              id="speed-control"
              min="0.5"
              max="1.5"
              step="0.05"
              value="1"
            />

            <button
              type="button"
              id="increase-speed"
              title="Aumentar velocidad"
            >
              +
            </button>

            <span id="speed-value">1.00×</span>

            <span class="tempo-display">
              BPM:
              <strong id="tempo-value">—</strong>
            </span>
          </div>
        </div>

        <div class="timeline-container">
          <span id="current-time">0:00</span>

          <input
            id="timeline"
            type="range"
            min="0"
            max="60"
            step="0.01"
            value="0"
          />

          <span id="duration">1:00</span>
        </div>

        <div id="status">Detenido</div>
      </section>
    </main>

    <div id="controls-trigger"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
